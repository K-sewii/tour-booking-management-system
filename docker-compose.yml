# Development stack: SQL Server + API + Web (BFF + SPA).
# Usage: cp .env.example .env  &&  docker compose up --build
# The WinForms Admin app is Windows-only and runs on the host against http://localhost:5080.
name: dongnamtrip

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./db/init.sh:/init.sh:ro
      - ./db/init:/init:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Backend/DongNamTrip.Api/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      # The API refuses to start outside Development (demo-grade auth and in-memory catalog).
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: "*"
      ConnectionStrings__DongNamTrip: "Server=db;Database=DongNamTrip;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      BootstrapAdmin__Enabled: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BootstrapAdmin__Name: ${BOOTSTRAP_ADMIN_NAME:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DevelopmentTestAccounts__Enabled: "false"
    ports:
      - "127.0.0.1:5080:8080"
    healthcheck:
      # /dev/tcp is bash-only (CMD-SHELL uses sh/dash), and "\\r\\n" must stay escaped inside YAML double quotes.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: src/Frontend/DongNamTrip.Web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: http://api:8080/
    ports:
      - "127.0.0.1:5081:8080"

volumes:
  sqldata:
