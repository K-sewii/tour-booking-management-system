name: Build and smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build DongNamTrip.sln --configuration Release

  web-api:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      BootstrapAdmin__Enabled: 'false'
      DevelopmentTestAccounts__Enabled: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build API and Web in Debug
        shell: powershell
        run: |
          dotnet build src/DongNamTrip.Api --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/DongNamTrip.Web --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare isolated SQL Server LocalDB
        shell: powershell
        env:
          DONGNAMTRIP_CI_SQL_GZIP_BASE64: ${{ secrets.DONGNAMTRIP_CI_SQL_GZIP_BASE64 }}
        run: .\tests\prepare_ci_database.ps1

      - name: Run HTTP and SQL smoke tests
        run: python tests/smoke.py --start

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run browser tests
        run: python tests/browser_runner.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-previews
          path: artifacts/previews
          if-no-files-found: ignore
