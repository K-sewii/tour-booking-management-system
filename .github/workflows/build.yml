name: Build and smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DongNamTrip.Spa/package-lock.json

      - name: Install, type-check and build SPA
        working-directory: src/DongNamTrip.Spa
        run: |
          npm ci
          npm audit --audit-level=high --omit=dev
          npm run build

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build DongNamTrip.sln --configuration Release

  web-api:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      BootstrapAdmin__Enabled: 'false'
      DevelopmentTestAccounts__Enabled: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build API and Web in Debug
        shell: powershell
        run: |
          dotnet build src/DongNamTrip.Api --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build src/DongNamTrip.Web --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare isolated SQL Server LocalDB
        shell: powershell
        env:
          DONGNAMTRIP_CI_SQL_GZIP_BASE64: ${{ secrets.DONGNAMTRIP_CI_SQL_GZIP_BASE64 }}
        run: .\tests\prepare_ci_database.ps1

      - name: Apply account area SQL
        shell: powershell
        env:
          ACCOUNT_SQL_GZIP_BASE64: ${{ secrets.DONGNAMTRIP_CI_ACCOUNT_SQL_GZIP_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:ACCOUNT_SQL_GZIP_BASE64)) {
              throw 'Missing CI account SQL secret.'
          }

          Add-Type -AssemblyName System.Data
          Add-Type -AssemblyName System.IO.Compression

          $bytes = [Convert]::FromBase64String(
              $env:ACCOUNT_SQL_GZIP_BASE64.Trim()
          )

          $stream = [System.IO.MemoryStream]::new($bytes)

          $gzip = [System.IO.Compression.GZipStream]::new(
              $stream,
              [System.IO.Compression.CompressionMode]::Decompress
          )

          $reader = [System.IO.StreamReader]::new(
              $gzip,
              [System.Text.Encoding]::UTF8,
              $true
          )

          try {
              $sql = $reader.ReadToEnd()
          }
          finally {
              $reader.Dispose()
              $gzip.Dispose()
              $stream.Dispose()
          }

          $connectionString = 'Server=(localdb)\DongNamTripCI;Database=DongNamTrip;Integrated Security=True;Encrypt=False;Connect Timeout=30;'

          $connection = [System.Data.SqlClient.SqlConnection]::new(
              $connectionString
          )

          try {
              $connection.Open()

              $batches = [regex]::Split(
                  $sql,
                  '(?im)^[ \t]*GO[ \t]*(?:--[^\r\n]*)?\r?$'
              )

              foreach ($batch in $batches) {
                  if ([string]::IsNullOrWhiteSpace($batch)) {
                      continue
                  }

                  $command = $connection.CreateCommand()

                  try {
                      $command.CommandTimeout = 180
                      $command.CommandText = $batch
                      [void]$command.ExecuteNonQuery()
                  }
                  finally {
                      $command.Dispose()
                  }
              }

              Write-Host 'Account area SQL applied to CI LocalDB.'
          }
          finally {
              $connection.Dispose()
          }

      - name: Run HTTP and SQL smoke tests
        run: python tests/smoke.py --start

      - name: Run SCR02/SCR03 authentication tests
        run: python tests/auth_screens.py --start

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser tests
        run: python tests/browser_runner.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-previews
          path: artifacts/previews
          if-no-files-found: ignore